# Par défaut, l'application est accessible depuis Internet (les employés peuvent consulter
# leurs informations depuis chez eux).
#
# Pour n'autoriser que le réseau de la pharmacie, remplacez « allow all; » par exemple par :
#   allow 203.0.113.42;   # adresse IP publique de la box de la pharmacie
#   deny all;
# puis : docker compose -f deploy/compose/docker-compose.yml restart nginx
allow all;
