server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers versionnés par Vite : mis en cache longtemps.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/securite.conf;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/securite.conf;
        try_files $uri $uri/ /index.html;
    }
}
